<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbit-fav-core" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff5469" />
      <stop offset="55%" stop-color="#e0122b" />
      <stop offset="100%" stop-color="#99091b" />
    </radialGradient>
    <linearGradient id="orbit-fav-ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef3340" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ff7a88" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#c00a20" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="orbit-fav-ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8591" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ef3340" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b3091e" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Orbit Ring 1 Back-arc -->
  <g transform="translate(50, 50) rotate(-28)">
    <ellipse cx="0" cy="0" rx="42" ry="15" stroke="url(#orbit-fav-ring1)" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="135 30" fill="none" />
  </g>

  <!-- Orbit Ring 2 -->
  <g transform="translate(50, 50) rotate(50)">
    <ellipse cx="0" cy="0" rx="38" ry="13" stroke="url(#orbit-fav-ring2)" stroke-width="2.6" stroke-dasharray="105 32" fill="none" opacity="0.8" />
  </g>

  <!-- Central Planet Nucleus -->
  <circle cx="50" cy="50" r="18" fill="url(#orbit-fav-core)" />

  <!-- Highlight -->
  <circle cx="44" cy="43.5" r="5.5" fill="#ffffff" opacity="0.6" />

  <!-- Orbit Ring 1 Front-arc -->
  <g transform="translate(50, 50) rotate(-28)">
    <path d="M -39,6 A 42 15 0 0 0 39 5" stroke="url(#orbit-fav-ring1)" stroke-width="3.6" stroke-linecap="round" fill="none" />
    <!-- Satellite Node on Ring 1 -->
    <circle cx="38" cy="5" r="4.5" fill="#ffffff" stroke="#c00a20" stroke-width="2" />
  </g>

  <!-- Satellite Node on Ring 2 -->
  <g transform="translate(50, 50) rotate(50)">
    <circle cx="-34" cy="-5" r="3.2" fill="#ffffff" stroke="#ff4d61" stroke-width="1.5" />
  </g>
</svg>
